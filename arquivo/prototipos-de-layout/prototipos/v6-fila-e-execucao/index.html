<script>
  // Tema antes de desenhar a tela, para não piscar: a escolha salva ou, sem escolha, a do sistema.
  (function () {
    var t = null;
    try { t = localStorage.getItem('monitor-tema'); } catch (e) { /* sem armazenamento */ }
    if (t !== 'claro' && t !== 'escuro') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
    document.documentElement.dataset.tema = t;
  })();
</script>
